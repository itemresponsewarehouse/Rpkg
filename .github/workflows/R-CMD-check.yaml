# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          
      # redivis has a configure script that links against libcurl, and its
      # DESCRIPTION declares no SystemRequirements, so nothing installs the
      # headers for us. macOS and Windows runners already have them; Ubuntu
      # does not, and the build fails with "ERROR: libcurl not found."
      - name: Install system dependencies for redivis
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      # Install Redivis from GitHub before checking dependencies
      - name: Install Redivis from GitHub
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_github('redivis/redivis-r', ref='main')"
          # install_github() only warns when the build fails, which leaves the
          # dependency solve below to report a confusing "Can't find package
          # called redivis". Fail here instead, where the real error is.
          Rscript -e "if (!requireNamespace('redivis', quietly = TRUE)) stop('redivis failed to install; see the build output above')"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # check-r-package sets NOT_CRAN=true by default; run as CRAN does. There
      # are no Redivis credentials here, so the warehouse examples are skipped
      # by irw_has_credentials() rather than waiting on a browser login.
      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "false"
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Reading IRW needs no Redivis account (Rpkg#202). Nothing in the matrix
  # above proves that: those jobs run with NOT_CRAN=false, so the warehouse
  # examples and this check are skipped. This job has no credentials either --
  # which is exactly the environment the claim is about -- and runs the one
  # networked test. timeout-minutes is the backstop: a regression here shows up
  # as a login prompt nobody can answer, i.e. a job that waits.
  anonymous-read:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no login)
    timeout-minutes: 25

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Without pandoc on PATH, setup-r-dependencies decides whether it is
      # needed by running pak::pkg_deps("."), which resolves Suggests from the
      # configured repos only -- and redivis is not in any of them, installed
      # or not. Installing pandoc skips that branch, as it does in the jobs
      # above.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies for redivis
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      # After the dependency solve, not before: pak installs redivis from its
      # own cache, which can hold a build older than the 0.12.14 that reads
      # anonymously, and it would overwrite anything installed earlier. The
      # version check is the point of the job -- without it a stale client
      # makes the test skip and the job go green on nothing.
      - name: Install Redivis from GitHub
        run: |
          Rscript -e "if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes')"
          Rscript -e "remotes::install_github('redivis/redivis-r', ref='main', upgrade = 'never')"
          Rscript -e 'v <- utils::packageVersion("redivis"); cat("redivis", format(v), "\n"); if (v < "0.12.14") stop("redivis ", format(v), " authenticates every request; this job needs >= 0.12.14")'

      - name: Install irw
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Anonymous read, no credentials
        env:
          IRW_TEST_ANONYMOUS: "true"
          NOT_CRAN: "true"
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_dir("tests/testthat", package = "irw", load_package = "installed", filter = "anonymous-read", stop_on_failure = TRUE)); stopifnot(sum(res$failed) == 0, !any(as.logical(res$skipped)), sum(res$passed) > 0)'

  # CRAN does not install from Additional_repositories, so its machines check
  # irw without redivis. Reproduce that: install every dependency except it.
  cran-no-redivis:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no redivis)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::arrow
            any::testthat
            any::withr
            any::evaluate
            any::mirt
            any::gnm
            any::BradleyTerry2
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "false"
          _R_CHECK_FORCE_SUGGESTS_: "false"
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
