# Opens a release PR: bumps the version in DESCRIPTION and writes the NEWS.md
# entry from the pull requests merged since the last release tag.
#
# Run it from the Actions tab (release-prepare.yaml -> Run workflow) and pick
# patch, minor or major. Merging the PR it opens is what actually releases:
# release-publish.yaml then tags the commit and cuts the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      since:
        description: "Only list PRs merged after this ISO timestamp (blank = auto-detect)"
        type: string
        default: ""

name: release-prepare.yaml

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail
          # No `| head -1` anywhere in this workflow: head exits early, git and
          # sed take SIGPIPE, and `set -o pipefail` turns that into exit 141.
          current=$(awk '/^Version:/ {sub(/^Version:[[:space:]]*/, ""); print; exit}' DESCRIPTION)
          if ! printf '%s' "$current" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "DESCRIPTION has a version this workflow cannot bump: '$current'" >&2
            echo "Expected major.minor.patch." >&2
            exit 1
          fi
          major=${current%%.*}
          rest=${current#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $next"

      - name: Collect merged pull requests since the last release
        id: changelog
        run: |
          set -euo pipefail
          last_tag=$(git for-each-ref --count=1 --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/v*')
          if [ -n "${{ inputs.since }}" ]; then
            since="${{ inputs.since }}"
            echo "Changes since $since (given as input)"
          elif [ -n "$last_tag" ]; then
            # Always UTC, in gh's own Z-suffixed shape: the jq filter below
            # compares these timestamps as strings against mergedAt, so a local
            # -07:00 offset would let PRs merged *before* the tag sort after it,
            # and a +00:00 offset would still miss the tag commit itself.
            since=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$last_tag")
            echo "Changes since $last_tag ($since)"
          else
            # No release tag yet. The last time DESCRIPTION's version changed is
            # the honest start of this release; fall back to the root commit if
            # even that cannot be found.
            since=$(TZ=UTC0 git log -n1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ \
              -S"Version: ${{ steps.version.outputs.current }}" -- DESCRIPTION)
            if [ -z "$since" ]; then
              root=$(git rev-list --max-parents=0 HEAD | tail -1)
              since=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$root")
              echo "No release tag and no version bump in history; using the whole history"
            else
              echo "No release tag yet; using changes since ${{ steps.version.outputs.current }} was set ($since)"
            fi
          fi
          gh pr list --state merged --base main --limit 200 \
            --json number,title,mergedAt \
            --jq "[.[] | select(.mergedAt > \"$since\")] | sort_by(.mergedAt) | reverse | .[] | \"- \(.title) (#\(.number))\"" \
            > changelog.md
          if [ ! -s changelog.md ]; then
            echo "- Maintenance release; no pull requests merged since ${last_tag:-the first commit}." > changelog.md
          fi
          cat changelog.md

      - name: Update DESCRIPTION and NEWS.md
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          sed -i "s/^Version:.*/Version: $next/" DESCRIPTION
          {
            printf '# irw %s\n\n' "$next"
            cat changelog.md
            printf '\n'
            if [ -f NEWS.md ]; then cat NEWS.md; fi
          } > NEWS.md.tmp
          mv NEWS.md.tmp NEWS.md
          rm changelog.md

      - name: Open the release pull request
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          branch="release/v$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add DESCRIPTION NEWS.md
          git commit -m "Release irw $next"
          git push --force origin "$branch"
          body=$(printf 'Bumps `DESCRIPTION` to %s and adds the `NEWS.md` entry below, generated from the pull requests merged since the last release.\n\nEdit `NEWS.md` on this branch if the generated list needs tidying. Merging tags `v%s` and publishes the release automatically.\n' "$next" "$next")

          # Creating the PR needs "Allow GitHub Actions to create and approve
          # pull requests" (Settings -> Actions -> General), which an org can
          # withhold. The branch is already pushed either way, so fall back to
          # handing over a link rather than failing a release that succeeded.
          if gh pr create --base main --head "$branch" \
               --title "Release irw $next" --body "$body"; then
            exit 0
          fi

          repo_url="${{ github.server_url }}/${{ github.repository }}"
          {
            printf '## Release irw %s is ready, but needs a PR opened by hand\n\n' "$next"
            printf 'Branch `%s` is pushed with the version bump and the changelog. ' "$branch"
            printf 'GitHub Actions is not permitted to open pull requests in this repository, so:\n\n'
            printf '%s/compare/main...%s?expand=1\n\n' "$repo_url" "$branch"
            printf 'Enabling "Allow GitHub Actions to create and approve pull requests" '
            printf '(Settings -> Actions -> General -> Workflow permissions) removes this step.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Release branch $branch pushed, but Actions cannot open the PR. See the run summary for the link."
