# Opens a release PR: bumps the version in DESCRIPTION, names the NEWS.md
# development section after it, and appends the pull requests merged since the
# last release tag to that section.
#
# Run it from the Actions tab (release-prepare.yaml -> Run workflow) and pick
# patch, minor or major. Merging the PR it opens is what actually releases:
# release-publish.yaml then tags the commit and cuts the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      since:
        description: "Only list PRs merged after this ISO timestamp (blank = auto-detect)"
        type: string
        default: ""

name: release-prepare.yaml

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail
          # No `| head -1` anywhere in this workflow: head exits early, git and
          # sed take SIGPIPE, and `set -o pipefail` turns that into exit 141.
          current=$(awk '/^Version:/ {sub(/^Version:[[:space:]]*/, ""); print; exit}' DESCRIPTION)
          # A fourth component is a development version: usethis writes
          # 1.3.1.9001 for "1.3.1 plus unreleased work", which is what
          # DESCRIPTION carries between releases. It is parsed and then
          # discarded, so a patch bump from 1.3.1.9001 is 1.3.2 and a minor
          # bump is 1.4.0. The guard itself stays: a version this cannot
          # parse must stop the run rather than be bumped to something wrong.
          if ! printf '%s' "$current" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "DESCRIPTION has a version this workflow cannot bump: '$current'" >&2
            echo "Expected major.minor.patch, optionally with a development suffix." >&2
            exit 1
          fi
          major=${current%%.*}
          rest=${current#*.}
          minor=${rest%%.*}
          rest=${rest#*.}
          patch=${rest%%.*}
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $next"

      - name: Collect merged pull requests since the last release
        id: changelog
        run: |
          set -euo pipefail
          last_tag=$(git for-each-ref --count=1 --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/v*')
          if [ -n "${{ inputs.since }}" ]; then
            since="${{ inputs.since }}"
            echo "Changes since $since (given as input)"
          elif [ -n "$last_tag" ]; then
            # Always UTC, in gh's own Z-suffixed shape: the jq filter below
            # compares these timestamps as strings against mergedAt, so a local
            # -07:00 offset would let PRs merged *before* the tag sort after it,
            # and a +00:00 offset would still miss the tag commit itself.
            since=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$last_tag")
            echo "Changes since $last_tag ($since)"
          else
            # No release tag yet. The last time DESCRIPTION's version changed is
            # the honest start of this release; fall back to the root commit if
            # even that cannot be found.
            since=$(TZ=UTC0 git log -n1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ \
              -S"Version: ${{ steps.version.outputs.current }}" -- DESCRIPTION)
            if [ -z "$since" ]; then
              root=$(git rev-list --max-parents=0 HEAD | tail -1)
              since=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$root")
              echo "No release tag and no version bump in history; using the whole history"
            else
              echo "No release tag yet; using changes since ${{ steps.version.outputs.current }} was set ($since)"
            fi
          fi
          # Release PRs are dropped by head branch, not by time: GitHub stamps
          # mergedAt a second or so after the committer date of the commit the
          # merge produces, so a release PR always lands just after its own tag
          # and would reappear in the next release's notes.
          gh pr list --state merged --base main --limit 200 \
            --json number,title,mergedAt,headRefName \
            --jq "[.[] | select(.mergedAt > \"$since\") | select(.headRefName | startswith(\"release/\") | not)] | sort_by(.mergedAt) | reverse | .[] | \"- \(.title) (#\(.number))\"" \
            > changelog.md
          if [ ! -s changelog.md ]; then
            echo "- Maintenance release; no pull requests merged since ${last_tag:-the first commit}." > changelog.md
          fi
          cat changelog.md

      - name: Update DESCRIPTION and NEWS.md
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          sed -i "s/^Version:.*/Version: $next/" DESCRIPTION
          # NEWS.md opens with "# irw (development version)" whenever anything
          # has been written by hand since the last release, and those notes
          # are the notes for *this* release. So that section is renamed in
          # place and the generated list appended at the end of it. Prepending
          # a second section instead would label the hand-written notes as
          # unreleased and leave the release itself carrying only PR titles.
          # With no development section there is nothing to orphan, and the
          # generated section goes on top as before.
          dev='# irw (development version)'
          # No `head`: sed and awk here read the whole file, so nothing can
          # exit early and take SIGPIPE under `set -o pipefail`.
          first=$(sed -n '1p' NEWS.md 2>/dev/null || true)
          if [ -f NEWS.md ] && [ "$first" = "$dev" ]; then
            # First line of the next top-level section, empty if there is none.
            boundary=$(awk 'NR > 1 && /^# irw / { print NR; exit }' NEWS.md)
            {
              printf '# irw %s\n' "$next"
              if [ -n "$boundary" ]; then
                sed -n "2,$((boundary - 1))p" NEWS.md
              else
                sed -n '2,$p' NEWS.md
              fi
              cat changelog.md
              printf '\n'
              if [ -n "$boundary" ]; then
                sed -n "$boundary,\$p" NEWS.md
              fi
            } > NEWS.md.tmp
          else
            {
              printf '# irw %s\n\n' "$next"
              cat changelog.md
              printf '\n'
              if [ -f NEWS.md ]; then cat NEWS.md; fi
            } > NEWS.md.tmp
          fi
          mv NEWS.md.tmp NEWS.md
          rm changelog.md

      - name: Open the release pull request
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.next }}"
          branch="release/v$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add DESCRIPTION NEWS.md
          git commit -m "Release irw $next"
          git push --force origin "$branch"
          body=$(printf 'Bumps `DESCRIPTION` to %s. The `NEWS.md` development section is renamed to `# irw %s`, and the pull requests merged since the last release are listed at the end of it.\n\nThat generated list is there to catch merges nobody wrote a note for: fold anything it turns up into the notes above it, then delete the list before merging. Merging tags `v%s` and publishes the release automatically.\n' "$next" "$next" "$next")

          # Creating the PR needs "Allow GitHub Actions to create and approve
          # pull requests" (Settings -> Actions -> General), which an org can
          # withhold. The branch is already pushed either way, so fall back to
          # handing over a link rather than failing a release that succeeded.
          if gh pr create --base main --head "$branch" \
               --title "Release irw $next" --body "$body"; then
            exit 0
          fi

          repo_url="${{ github.server_url }}/${{ github.repository }}"
          {
            printf '## Release irw %s is ready, but needs a PR opened by hand\n\n' "$next"
            printf 'Branch `%s` is pushed with the version bump and the changelog. ' "$branch"
            printf 'GitHub Actions is not permitted to open pull requests in this repository, so:\n\n'
            printf '%s/compare/main...%s?expand=1\n\n' "$repo_url" "$branch"
            printf 'Enabling "Allow GitHub Actions to create and approve pull requests" '
            printf '(Settings -> Actions -> General -> Workflow permissions) removes this step.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Release branch $branch pushed, but Actions cannot open the PR. See the run summary for the link."
